model:
  block_size: 128
  n_layer: 4
  n_head: 4
  n_embd: 128
  dropout: 0.1

train:
  data_path: data/sample.txt
  out_dir: checkpoints
  batch_size: 32
  max_steps: 2000
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 100
  grad_clip: 1.0
  eval_interval: 200
  eval_batches: 20
  val_fraction: 0.1
  seed: 1337
